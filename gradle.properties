android.useAndroidX=true
kotlin.code.style=official

# R class per-modul, bukan gabungan seluruh dependensi. Di 18 modul ini bedanya
# besar: tanpa ini setiap modul ikut menghasilkan ulang R milik semua modul di
# bawahnya. Sudah diverifikasi tidak ada kode yang membaca R milik modul lain.
android.nonFinalResIds=true
android.nonTransitiveRClass=true

# Jetifier dimatikan: ia membongkar-pasang ulang SETIAP aar/jar dependensi untuk
# menambal paket android.support.*, dan repo ini tidak memakai satu pun support
# library lama (semuanya sudah androidx).
android.enableJetifier=false

org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Djava.io.tmpdir=C:/t
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC

# 18 modul di mesin 12 core: tanpa parallel, modul-modul yang tidak saling
# bergantung tetap dikerjakan satu per satu.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# ABI yang dibangun untuk varian debug. Perangkat uji (SM-A075F) arm64-v8a, jadi
# tiga ABI lain hanya membuang waktu CMake tiap build. Kosongkan bila memakai
# emulator x86_64. Rilis tidak terpengaruh — APK rilis tetap semua ABI.
superapp.debugAbi=arm64-v8a
